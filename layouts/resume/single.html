<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 11pt;
            line-height: 1.5;
            color: #111;
            background: #fff;
            max-width: 780px;
            margin: 0 auto;
            padding: 1rem 2rem 3rem;
        }

        .resume-toolbar {
            display: flex;
            gap: 1rem;
            align-items: center;
            padding: 0.75rem 0;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #ddd;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.9rem;
        }

        .resume-toolbar a {
            color: #555;
            text-decoration: none;
        }
        .resume-toolbar a:hover { text-decoration: underline; }

        .print-btn {
            margin-left: auto;
            padding: 0.4rem 1rem;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
        }
        .print-btn:hover { background: #333; }

        h1 { font-size: 1.9em; margin: 0 0 0.1em; }
        h2 {
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-bottom: 1.5px solid #111;
            padding-bottom: 0.15em;
            margin: 1.4em 0 0.5em;
        }
        h3 { font-size: 1em; margin: 1em 0 0; }
        h4 { font-size: 0.95em; font-weight: normal; font-style: italic; margin: 0 0 0.4em; color: #444; }

        p.contact {
            color: #444;
            font-size: 0.95em;
            margin: 0.1em 0 0.8em;
        }

        ul { margin: 0.3em 0 0.5em 1.2em; padding: 0; }
        li { margin-bottom: 0.25em; }

        @media print {
            .resume-toolbar { display: none !important; }
            body { padding: 0; font-size: 10.5pt; }
            h2 { break-after: avoid; }
            h3 { break-after: avoid; }
            @page { margin: 1.5cm 1.8cm; }
        }
    </style>
</head>
<body>
    <div class="resume-toolbar no-print">
        <a href="{{ .Site.BaseURL }}">← Home</a>
        <button class="print-btn" onclick="window.print()">Print / Save PDF</button>
    </div>
    <main>
        {{ .Content }}
    </main>
</body>
</html>
