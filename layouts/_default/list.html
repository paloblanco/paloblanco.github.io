{{ define "main" }}
<h1>{{ .Title }}</h1>

{{ with .Content }}
<section>{{ . }}</section>
{{ end }}

{{ range .Pages.ByDate.Reverse }}
<article>
    <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
    {{ if .Description }}<p>{{ .Description }}</p>{{ end }}
    <small>{{ .Date.Format "January 2, 2006" }}</small>
</article>
{{ end }}
{{ end }}
